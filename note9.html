<!DOCTYPE html>
<html>
<head>
    <title>枪械武器图鉴</title>
    <style>
        .container { width: 550px; margin: 0 auto; border: 3px solid #222; padding: 25px; background: #1a1a1a; color: #eee; }
        .title { color: #ff4444; text-align: center; }
        .weapon-item { border-bottom: 1px solid #444; padding: 12px 0; }
        .name { font-size: 20px; color: #ffcc00; }
        .attr { color: #aaa; margin-top: 4px; }
        .damage { color: #ff5555; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="title">枪械武器图鉴</h1>
        <div class="weapon-item">
            <div class="name">AK47 突击步枪</div>
            <div class="attr">类型：自动步枪 | 伤害：<span class="damage">42</span> | 射速：7.6发/秒</div>
            <div class="attr">优势：近距离爆发高，容错率强</div>
        </div>
        <div class="weapon-item">
            <div class="name">M4A1 卡宾枪</div>
            <div class="attr">类型：自动步枪 | 伤害：<span class="damage">36</span> | 射速：9.2发/秒</div>
            <div class="attr">优势：后坐力低，中远距离稳定</div>
        </div>
        <div class="weapon-item">
            <div class="name">AWM 狙击枪</div>
            <div class="attr">类型：栓动狙击 | 伤害：<span class="damage">132</span> | 射速：0.8发/秒</div>
            <div class="attr">优势：一枪击穿头部防具</div>
        </div>
    </div>
</body>
</html>
